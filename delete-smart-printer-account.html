
<!DOCTYPE html>

  <style>

        }

        }


        .sec-heading {
            font-weight: 700;x
            font-size: 25.34px;
            line-height: 38.01px;

   /* ======= Responsive ====== */

   @media screen and (max-width: 600px) {

body {

    }

.container {
        height: 100vh;
        text-align: center;
   }

.sec-heading {
    font-weight: 700;

    /* border-radius: 10px; */
    padding: 10px 15px;
}

}

}

}
